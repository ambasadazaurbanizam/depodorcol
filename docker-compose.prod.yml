services:
  app:
    container_name: depodorcol-app
    image: depodorcol:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      WRANGLER_WRITE_LOGS: "false"
      WRANGLER_LOG_PATH: /tmp/wrangler/logs
      MINIFLARE_REGISTRY_PATH: /tmp/wrangler/registry
      CONTRIBUTION_EMAIL: ${CONTRIBUTION_EMAIL:-sergey.belyuga@gmail.com}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-resend}
      SMTP_PASS: ${SMTP_PASS:-${RESEND_API_KEY}}
      SMTP_FROM: ${SMTP_FROM:-onboarding@resend.dev}
    networks:
      - shared-web

  caddy:
    container_name: depodorcol-caddy
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - shared-web

networks:
  shared-web:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
