services:
  app:
    container_name: depodorcol-local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      WRANGLER_WRITE_LOGS: "false"
      WRANGLER_LOG_PATH: /tmp/wrangler/logs
      MINIFLARE_REGISTRY_PATH: /tmp/wrangler/registry
      CONTRIBUTION_EMAIL: "sergey.belyuga@gmail.com"
      SMTP_HOST: "smtp.resend.com"
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_REQUIRE_TLS: "true"
      SMTP_USER: "resend"
      SMTP_PASS: ${RESEND_API_KEY}
      SMTP_FROM: ${SMTP_FROM:-onboarding@resend.dev}
